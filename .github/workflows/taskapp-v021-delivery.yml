name: Temporary TaskApp v0.2.1 delivery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/taskapp-v021-delivery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch and verify APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 --retry 5 --retry-all-errors \
            "https://litter.catbox.moe/iy9nxu.apk" \
            --output TaskApp-v0.2.1-debug.apk
          echo "7dfb65763ab568607418bb0886f8431c2f328f30d71356f2eff1a4426fb09cc5  TaskApp-v0.2.1-debug.apk" | sha256sum -c -
          unzip -t TaskApp-v0.2.1-debug.apk >/dev/null

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskApp-v0.2.1-debug-apk
          path: TaskApp-v0.2.1-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
