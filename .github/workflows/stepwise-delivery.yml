name: Remove temporary Stepwise APK artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stepwise-delivery.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete temporary artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/9007525899"
